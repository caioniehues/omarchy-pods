# Fork-only: the same suites as .githooks/pre-commit, on the packages setup installs.
name: check
on:
  push:
    branches: [build]
  pull_request:
    branches: [build]
jobs:
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed git base-devel deno
      - uses: actions/checkout@v4
      # Read from setup, so CI builds against exactly what a user's install gets.
      - run: pacman -S --noconfirm --needed $(sed -n 's/^omarchy pkg add //p' setup)
      - run: cmake -S daemon -B daemon/build -G Ninja && cmake --build daemon/build
      - run: ctest --test-dir daemon/build --output-on-failure
        env:
          QT_QPA_PLATFORM: offscreen
      - run: deno run --allow-read tests/model.test.js
      - run: deno run --allow-read tests/connection-events.test.js
